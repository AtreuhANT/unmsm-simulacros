version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: unmsm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: simulacro_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simulacro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: unmsm_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Define DOCKER_DATABASE_URL en .env}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      FLASK_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  pgdata:
    driver: local
